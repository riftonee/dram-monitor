name: DRAM monitor

on:
  schedule:
    # Alerts: every 30 minutes, 24/7 (memory news breaks during Asia overnight).
    - cron: "*/30 * * * *"
    # Daily brief: 12:05 UTC (~8am ET). 12:05 is deliberately NOT a :00/:30 slot,
    # so the every-30-min alerts cron never fires at the same minute.
    - cron: "5 12 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: alerts
        options: [alerts, brief]

# State is committed back to the repo, so we need write access...
permissions:
  contents: write

# ...and runs must not overlap, or two runs could push state and conflict.
concurrency:
  group: dram-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Determine mode
        run: |
          if [ "${{ github.event.schedule }}" = "5 12 * * *" ]; then
            echo "MODE=brief" >> "$GITHUB_ENV"
          else
            echo "MODE=${{ github.event.inputs.mode || 'alerts' }}" >> "$GITHUB_ENV"
          fi

      - name: Run monitor
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python -m src.run "$MODE"

      - name: Commit updated state
        # Always — state (seen/buffer) is written to disk before any email send,
        # so committing even on a send failure prevents re-processing/re-alerting.
        if: always()
        run: |
          git config user.name "dram-monitor[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
          else
            git commit -m "state: update seen/buffer [skip ci]"
            git push
          fi
