name: DRAM monitor

on:
  schedule:
    # Alerts: every 30 minutes, 24/7 (memory news breaks during Asia overnight).
    - cron: "*/30 * * * *"
    # NOTE: the daily brief is NOT scheduled here. GitHub's cron is best-effort and
    # was slipping the 12:05 UTC brief by hours (landing ~9am PT instead of ~5am PT).
    # The brief is now fired punctually by an EXTERNAL scheduler (cron-job.org) that
    # calls this workflow via workflow_dispatch with mode=brief at 12:05 UTC.
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        type: choice
        default: alerts
        options: [alerts, brief]

# State is committed back to the repo, so we need write access...
permissions:
  contents: write

# ...and runs must not overlap, or two runs could push state and conflict.
concurrency:
  group: dram-monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Determine mode
        # Scheduled runs are always alerts (every-30-min cron). The daily brief
        # arrives via workflow_dispatch (mode=brief) from the external scheduler.
        run: |
          echo "MODE=${{ github.event.inputs.mode || 'alerts' }}" >> "$GITHUB_ENV"

      - name: Run monitor
        env:
          # LLM backend: leave unset for Anthropic (default), or set the
          # LLM_PROVIDER repo Variable to "gemini" and add the GEMINI_API_KEY Secret.
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          EDGAR_USER_AGENT: ${{ secrets.EDGAR_USER_AGENT }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          ALPHA_VANTAGE_KEY: ${{ secrets.ALPHA_VANTAGE_KEY }}
        run: python -m src.run "$MODE"

      - name: Commit updated state
        # Always — state (seen/buffer) is written to disk before any email send,
        # so committing even on a send failure prevents re-processing/re-alerting.
        if: always()
        run: |
          git config user.name "dram-monitor[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add state/
          if git diff --cached --quiet; then
            echo "no state changes"
            exit 0
          fi
          git commit -m "state: update seen/buffer [skip ci]"
          # main may have advanced (a manual push, or another run) since checkout.
          # State touches only state/*.json, so a rebase merges cleanly; retry the
          # push a few times, rebasing onto the latest each attempt.
          for attempt in 1 2 3 4 5; do
            if git push origin HEAD:main; then
              echo "state pushed"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — rebasing onto latest main"
            git pull --rebase --autostash origin main || true
          done
          echo "could not push state after retries" >&2
          exit 1
